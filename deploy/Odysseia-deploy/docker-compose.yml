      api:
        condition: service_healthy
  cassandra:
    image: ${CASSANDRA_IMAGE:-cassandra:5.0.5}
    profiles:
      - bundled-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: Odysseia
      CASSANDRA_DC: ${FLUXER_CASSANDRA_LOCAL_DC:-datacenter1}
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP_SIZE:-2G}
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE:-512M}
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - fluxer
    deploy:
      resources:
        limits:
          memory: ${CASSANDRA_MEMORY_LIMIT:-4gb}
    healthcheck:
      test:
        - CMD-SHELL
        - cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' >/dev/null
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s
