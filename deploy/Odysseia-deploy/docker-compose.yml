        - node
        - -e
        - const age=Date.now()-require('node:fs').statSync('/tmp/fluxer-worker-heartbeat').mtimeMs;if(age>30000){console.error('worker heartbeat is '+Math.round(age)+'ms old');process.exit(1)}
      interval: ${FLUXER_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${FLUXER_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${FLUXER_WORKER_HEALTHCHECK_RETRIES:-3}
      start_period: ${FLUXER_APP_HEALTHCHECK_START_PERIOD:-90s}
