      - ${INTEGRATION_WG_IP:?set Fluxer WireGuard IP}:4223:4222
    networks:
      - fluxer
    deploy:
      resources:
        limits:
          memory: ${INTEGRATION_NATS_MEMORY_LIMIT:-512mb}
