# Community-owned deployment, based on dev 718c7ba54.
name: odysseia
services:
  edge:
    restart: ${FLUXER_RESTART_POLICY:-unless-stopped}
    networks:
      - fluxer
    image: ${FLUXER_CADDY_IMAGE:-caddy:2.11-alpine}
    deploy:
      resources:
        limits:
          memory: ${FLUXER_CADDY_MEMORY_LIMIT:-1792m}
    ports:
      - ${FLUXER_HTTP_PORT:-80}:80
      - ${FLUXER_HTTPS_PORT:-443}:443
      - ${FLUXER_HTTPS_PORT:-443}:443/udp
    environment:
      GOMEMLIMIT: ${FLUXER_CADDY_GOMEMLIMIT:-1536MiB}
      FLUXER_EDGE_SITE_ADDRESS: ${FLUXER_EDGE_SITE_ADDRESS:-${FLUXER_CADDY_SITE_ADDRESS:-${FLUXER_PUBLIC_SCHEME:-https}://${FLUXER_DOMAIN:?set FLUXER_DOMAIN in .env}}}
      FLUXER_EDGE_TRUSTED_PROXIES: ${FLUXER_EDGE_TRUSTED_PROXIES:-private_ranges}
      FLUXER_EDGE_ENCODE: ${FLUXER_EDGE_ENCODE:-zstd gzip}
      FLUXER_EDGE_GLOBAL_OPTIONS: ${FLUXER_EDGE_GLOBAL_OPTIONS:-}
      FLUXER_ADMIN_BASE_PATH: ${FLUXER_ADMIN_BASE_PATH:-/admin}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - edge-data:/data
      - edge-config:/config
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:2019/config/
      interval: ${FLUXER_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${FLUXER_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${FLUXER_HEALTHCHECK_RETRIES:-10}
    depends_on:
      api:
        condition: service_started
      gateway:
        condition: service_healthy
      media-proxy:
        condition: service_started
      static-proxy:
        condition: service_started
      admin:
        condition: service_started
  valkey:
    restart: ${FLUXER_RESTART_POLICY:-unless-stopped}
    networks:
      - fluxer
    image: ${FLUXER_VALKEY_IMAGE:-valkey/valkey:9.1-alpine}
    deploy:
      resources:
        limits:
          memory: ${FLUXER_VALKEY_MEMORY_LIMIT:-256mb}
    command:
      - valkey-server
      - --appendonly
      - yes
      - --appendfsync
      - ${FLUXER_VALKEY_APPENDFSYNC:-everysec}
      - --dir
      - /data
      - --maxmemory
      - ${FLUXER_VALKEY_MAXMEMORY:-192mb}
      - --maxmemory-policy
      - ${FLUXER_VALKEY_MAXMEMORY_POLICY:-noeviction}
    volumes:
      - valkey-data:/data
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: ${FLUXER_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${FLUXER_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${FLUXER_HEALTHCHECK_RETRIES:-10}
  nats:
    restart: ${FLUXER_RESTART_POLICY:-unless-stopped}
    networks:
      - fluxer
    image: ${FLUXER_NATS_IMAGE:-nats:2.14-alpine}
    deploy:
      resources:
        limits:
          memory: ${FLUXER_NATS_MEMORY_LIMIT:-256mb}
    command:
      - -js
      - -sd
      - /data
      - -m
      - "8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8222/healthz
      interval: ${FLUXER_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${FLUXER_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${FLUXER_HEALTHCHECK_RETRIES:-10}
  meilisearch:
    restart: ${FLUXER_RESTART_POLICY:-unless-stopped}
    networks:
      - fluxer
    image: ${FLUXER_MEILISEARCH_IMAGE:-getmeili/meilisearch:v1.53}
    deploy:
      resources:
        limits:
          memory: ${FLUXER_MEILISEARCH_MEMORY_LIMIT:-1536mb}
    environment:
      MEILI_ENV: ${FLUXER_MEILISEARCH_ENV:-production}
      MEILI_NO_ANALYTICS: ${FLUXER_MEILISEARCH_NO_ANALYTICS:-true}
      MEILI_UPGRADE_DB: "true"
      MEILI_MAX_INDEXING_MEMORY: ${FLUXER_MEILISEARCH_MAX_INDEXING_MEMORY:-256mb}
      MEILI_MAX_INDEXING_THREADS: ${FLUXER_MEILISEARCH_MAX_INDEXING_THREADS:-2}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:7700/health
      interval: ${FLUXER_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${FLUXER_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${FLUXER_HEALTHCHECK_RETRIES:-10}
  seaweedfs:
    restart: ${FLUXER_RESTART_POLICY:-unless-stopped}
    networks:
      - fluxer
    image: ${FLUXER_SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.47}
    deploy:
      resources:
        limits:
          memory: ${FLUXER_SEAWEEDFS_MEMORY_LIMIT:-2gb}
    environment:
      GOMEMLIMIT: ${FLUXER_SEAWEEDFS_GOMEMLIMIT:-1536MiB}
      WEED_MASTER_VOLUME_GROWTH_COPY_1: ${FLUXER_SEAWEEDFS_VOLUME_GROWTH:-1}
    command:
      - server
      - -s3
      - -dir=/data
      - -master.telemetry=${FLUXER_SEAWEEDFS_TELEMETRY:-false}
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8333/healthz
      interval: ${FLUXER_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${FLUXER_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${FLUXER_SEAWEEDFS_HEALTHCHECK_RETRIES:-20}
      start_period: ${FLUXER_SEAWEEDFS_HEALTHCHECK_START_PERIOD:-60s}
  seaweedfs-init:
    image: ${FLUXER_SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.47}
    deploy:
      resources:
        limits:
          memory: ${FLUXER_SEAWEEDFS_INIT_MEMORY_LIMIT:-128mb}
    networks:
      - fluxer
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: no
    environment:
      FLUXER_S3_ACCESS_KEY: ${FLUXER_S3_ACCESS_KEY:?set FLUXER_S3_ACCESS_KEY in .env}
      FLUXER_S3_SECRET_KEY: ${FLUXER_S3_SECRET_KEY:?set FLUXER_S3_SECRET_KEY in .env}
      FLUXER_S3_BUCKET_CDN: ${FLUXER_S3_BUCKET_CDN:-fluxer}
      FLUXER_S3_BUCKET_UPLOADS: ${FLUXER_S3_BUCKET_UPLOADS:-fluxer-uploads}
      FLUXER_S3_BUCKET_REPORTS: ${FLUXER_S3_BUCKET_REPORTS:-fluxer-reports}
      FLUXER_S3_BUCKET_HARVESTS: ${FLUXER_S3_BUCKET_HARVESTS:-fluxer-harvests}
      FLUXER_SEAWEEDFS_INIT_ATTEMPTS: ${FLUXER_SEAWEEDFS_INIT_ATTEMPTS:-60}
    entrypoint:
      - /bin/sh
      - -c
      - |
        buckets="$$FLUXER_S3_BUCKET_CDN $$FLUXER_S3_BUCKET_UPLOADS $$FLUXER_S3_BUCKET_REPORTS $$FLUXER_S3_BUCKET_HARVESTS"; missing="$$buckets"; for attempt in $$(seq 1 $$FLUXER_SEAWEEDFS_INIT_ATTEMPTS); do
          if ! nc -z seaweedfs 9333 2>/dev/null; then
            sleep 2;
            continue;
          fi;
          listed=$$(echo "s3.bucket.list" | timeout 10 weed shell -master=seaweedfs:9333 2>&1);
          missing="";
          for b in $$buckets; do
            echo "$$listed" | grep -q "^[[:space:]]*$$b[[:space:]]" || missing="$${missing:+$$missing }$$b";
          done;
          if [ -z "$$missing" ]; then
            if ! echo "s3.configure -user=fluxer -access_key=$$FLUXER_S3_ACCESS_KEY -secret_key=$$FLUXER_S3_SECRET_KEY -actions=Admin,Read,Write,List,Tagging -apply" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1; then
              echo "seaweedfs-init could not configure the S3 identity" >&2;
              exit 1;
            fi;
            echo "buckets ready";
            exit 0;
          fi;
          for b in $$missing; do
            echo "s3.bucket.create -name $$b" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1;
          done;
          sleep 2;
        done; echo "seaweedfs-init could not verify buckets: $$missing" >&2; exit 1;
  livekit:
    restart: ${FLUXER_RESTART_POLICY:-unless-stopped}
    networks:
      - fluxer
    image: ${FLUXER_LIVEKIT_IMAGE:-livekit/livekit-server:v1.12.0}
    deploy:
      resources:
        limits:
          memory: ${FLUXER_LIVEKIT_MEMORY_LIMIT:-512mb}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: ${FLUXER_LIVEKIT_LOG_LEVEL:-info}
        rtc:
          tcp_port: ${FLUXER_LIVEKIT_TCP_PORT:-7881}
          udp_port: ${FLUXER_LIVEKIT_UDP_PORT:-7882}
          use_external_ip: ${FLUXER_LIVEKIT_USE_EXTERNAL_IP:-true}
          node_ip: "${FLUXER_LIVEKIT_NODE_IP:-}"
          stun_servers:
            - ${FLUXER_LIVEKIT_STUN_PRIMARY:-stun.l.google.com:19302}
            - ${FLUXER_LIVEKIT_STUN_SECONDARY:-stun1.l.google.com:19302}
        webhook:
          api_key: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
          urls:
            - http://api:8080/webhooks/livekit
    ports:
      - ${FLUXER_LIVEKIT_TCP_PORT:-7881}:${FLUXER_LIVEKIT_TCP_PORT:-7881}
      - ${FLUXER_LIVEKIT_UDP_PORT:-7882}:${FLUXER_LIVEKIT_UDP_PORT:-7882}/udp
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:7880/
      interval: ${FLUXER_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${FLUXER_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${FLUXER_HEALTHCHECK_RETRIES:-10}
  api:
    restart: ${FLUXER_RESTART_POLICY:-unless-stopped}
    networks:
      - fluxer
    image: fluxer-local/fluxer-api:${FLUXER_PRODUCT_BUILD_TAG:?set an immutable community build tag}
    deploy:
      resources:
        limits:
          memory: ${FLUXER_API_MEMORY_LIMIT:-2560mb}
        reservations:
          memory: ${FLUXER_API_MEMORY_RESERVATION:-1gb}
    environment:
      FLUXER_DATABASE_BACKEND: cassandra
      FLUXER_READ_STATE_BATCHING_ENABLED: ${FLUXER_READ_STATE_BATCHING_ENABLED:-}
      FLUXER_CHANNEL_METADATA_CACHE_ENABLED: ${FLUXER_CHANNEL_METADATA_CACHE_ENABLED:-}
      FLUXER_GUILD_AVAILABILITY_CACHE_ENABLED: ${FLUXER_GUILD_AVAILABILITY_CACHE_ENABLED:-}
      FLUXER_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-}
      RUST_LOG: ${RUST_LOG:-}
      FLUXER_SELF_HOSTED: "true"
      FLUXER_BASE_DOMAIN: ${FLUXER_DOMAIN:?set FLUXER_DOMAIN in .env}
      FLUXER_PUBLIC_SCHEME: ${FLUXER_PUBLIC_SCHEME:-https}
      FLUXER_PUBLIC_PORT: ${FLUXER_PUBLIC_PORT:-443}
      FLUXER_PUBLIC_ORIGIN: ${FLUXER_PUBLIC_ORIGIN:-}
      FLUXER_TRUST_CLIENT_IP_HEADER: ${FLUXER_TRUST_CLIENT_IP_HEADER:-true}
      FLUXER_CLIENT_IP_HEADER_NAME: ${FLUXER_CLIENT_IP_HEADER_NAME:-}
      FLUXER_API_HEADERS_TIMEOUT_MS: ${FLUXER_API_HEADERS_TIMEOUT_MS:-}
      FLUXER_API_REQUEST_TIMEOUT_MS: ${FLUXER_API_REQUEST_TIMEOUT_MS:-}
      FLUXER_COMBINED_RATE_LIMIT_ENABLED: ${FLUXER_COMBINED_RATE_LIMIT_ENABLED:-true}
      FLUXER_COMBINED_CHANNEL_AUTH_ENABLED: ${FLUXER_COMBINED_CHANNEL_AUTH_ENABLED:-true}
      FLUXER_READ_STATE_COMBINED_GATEWAY_RPC_ENABLED: ${FLUXER_READ_STATE_COMBINED_GATEWAY_RPC_ENABLED:-true}
      FLUXER_READ_STATE_NARROW_AUTH_ENABLED: ${FLUXER_READ_STATE_NARROW_AUTH_ENABLED:-true}
      FLUXER_API_INSTANCES: ${FLUXER_API_INSTANCES:-1}
      FLUXER_INTERNAL_API_RPC_URLS: ${FLUXER_INTERNAL_API_RPC_URLS:-}
      FLUXER_API_MAX_INFLIGHT_REQUESTS: ${FLUXER_API_MAX_INFLIGHT_REQUESTS:-}
      FLUXER_API_IP_BAN_EXEMPT_IPS: ${FLUXER_API_IP_BAN_EXEMPT_IPS:-}
      FLUXER_IP_BAN_REFRESH_INTERVAL_MS: ${FLUXER_IP_BAN_REFRESH_INTERVAL_MS:-}
