      FLUXER_CASSANDRA_USERNAME: ${FLUXER_CASSANDRA_USERNAME:-}
      FLUXER_CASSANDRA_PASSWORD: ${FLUXER_CASSANDRA_PASSWORD:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8091/_ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    depends_on:
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      gifs:
        condition: service_healthy
      gifs-shard:
        condition: service_healthy
      snowflakes:
        condition: service_healthy
      snowflakes-shard:
        condition: service_healthy
      messages:
        condition: service_healthy
      messages-shard:
        condition: service_healthy
      users:
        condition: service_healthy
      users-shard:
        condition: service_healthy
      cassandra:
        condition: service_healthy
        required: false
      nats-integration:
        condition: service_healthy
    build:
      context: ../..
      dockerfile: fluxer_api/Dockerfile
      args:
        BUILD_VERSION: ${FLUXER_PRODUCT_BUILD_TAG:?set immutable build tag}
        SOURCE_SHA: ${FLUXER_SOURCE_SHA:?set source commit}
    command:
      - node
      - dist/IntegrationEntrypoint.js
networks:
  fluxer:
    driver: bridge
volumes:
  edge-data: null
  edge-config: null
  valkey-data: null
  nats-data: null
  meilisearch-data: null
  seaweedfs-data: null
  cassandra-data: {}
  nats-integration-data: {}
