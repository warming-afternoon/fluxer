server_name: odysseia-integration
port: 4222
http: 8222
max_payload: 262144
write_deadline: "5s"
jetstream {
  store_dir: /data/jetstream
  max_memory_store: 64MB
  max_file_store: 8GB
}

# 服务凭据由容器环境注入；不配置 routes、leafnodes 或 gateway。
authorization {
  users: [
    {
      user: "forum-service", password: $INTEGRATION_FORUM_PASSWORD
      permissions: {
        publish: {allow: ["rpc.auth.v1.session.resolve", "rpc.auth.v1.external.exchange", "rpc.auth.v1.external.prove", "rpc.auth.v1.session.revoke_current", "rpc.identity.v1.lookup_discord", "rpc.identity.v1.profiles", "rpc.identity.v1.login_eligibility", "rpc.identity.v1.rebind_service", "rpc.content.v1.thread.move_service", "rpc.content.v1.thread.create_service", "rpc.content.v1.thread.policy_service", "rpc.content.v1.starter.edit_service", "rpc.content.v1.thread.read_service", "rpc.content.v1.thread.update_service", "$JS.API.CONSUMER.MSG.NEXT.ODYSSEIA_CONTENT.forum-index", "$JS.API.CONSUMER.INFO.ODYSSEIA_CONTENT.forum-index", "$JS.ACK.ODYSSEIA_CONTENT.forum-index.>", "$JS.API.STREAM.INFO.ODYSSEIA_AUTH", "$JS.API.CONSUMER.MSG.NEXT.ODYSSEIA_AUTH.forum-auth", "$JS.API.CONSUMER.INFO.ODYSSEIA_AUTH.forum-auth", "$JS.ACK.ODYSSEIA_AUTH.forum-auth.>"]}
        subscribe: {allow: ["_INBOX.forum.>", "events.auth.v1.*", "events.identity.v1.binding_changed", "rpc.forum.v1.service_info"]}
        allow_responses: {max: 1, expires: "5s"}
      }
    },
    {
      user: "discord-sync", password: $INTEGRATION_BOT_PASSWORD
      permissions: {
        publish: {allow: ["rpc.identity.v1.ensure_discord", "rpc.identity.v1.lookup_discord", "rpc.identity.v1.profiles", "rpc.integration.v1.service_info", "rpc.forum.v1.service_info"]}
        subscribe: {allow: ["_INBOX.bot.>"]}
      }
    },
    {
      user: "fluxer-integration", password: $INTEGRATION_SERVICE_PASSWORD
      permissions: {
        publish: {allow: ["events.auth.v1.*", "events.identity.v1.binding_changed", "events.content.v1.>"]}
        subscribe: {allow: ["rpc.auth.v1.session.resolve", "rpc.auth.v1.external.exchange", "rpc.auth.v1.external.prove", "rpc.auth.v1.session.revoke_current", "rpc.identity.v1.ensure_discord", "rpc.identity.v1.lookup_discord", "rpc.identity.v1.profiles", "rpc.identity.v1.login_eligibility", "rpc.identity.v1.rebind_service", "rpc.content.v1.thread.move_service", "rpc.content.v1.thread.create_service", "rpc.content.v1.thread.policy_service", "rpc.content.v1.starter.edit_service", "rpc.content.v1.thread.read_service", "rpc.content.v1.thread.update_service", "rpc.integration.v1.service_info", "_INBOX.integration.>"]}
        allow_responses: {max: 1, expires: "30s"}
      }
    },
    {
      user: "fluxer-api", password: $INTEGRATION_API_PASSWORD
      permissions: {
        publish: {allow: ["events.auth.v1.*", "events.content.v1.>"]}
        subscribe: {allow: ["_INBOX.fluxer-api.>"]}
      }
    },
    {
      user: "fluxer-worker", password: $INTEGRATION_WORKER_PASSWORD
      permissions: {
        publish: {allow: ["events.auth.v1.*", "events.content.v1.>"]}
        subscribe: {allow: ["_INBOX.fluxer-worker.>"]}
      }
    },
    {
      user: "integration-admin", password: $INTEGRATION_ADMIN_PASSWORD
      permissions: {
        publish: {allow: ["$JS.API.STREAM.*.ODYSSEIA_CONTENT", "$JS.API.CONSUMER.*.ODYSSEIA_CONTENT.>", "$JS.API.CONSUMER.DURABLE.CREATE.ODYSSEIA_CONTENT.forum-index", "$JS.API.STREAM.*.ODYSSEIA_AUTH", "$JS.API.CONSUMER.*.ODYSSEIA_AUTH.>", "$JS.API.CONSUMER.DURABLE.CREATE.ODYSSEIA_AUTH.forum-auth", "events.content.v1.>"]}
        subscribe: {allow: ["_INBOX.admin.>"]}
      }
    }
  ]
}
